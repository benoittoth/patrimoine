name: robot
on:
  schedule:
    - cron: "*/15 7-17 * * 1-5"
    - cron: "40 21 * * *"
    - cron: "5 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: robot
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q yfinance youtube-transcript-api
      - run: python cours.py
      - if: github.event.schedule == '5 */3 * * *' || github.event_name == 'workflow_dispatch'
        run: python videos.py || true
      - run: |
          git config user.name robot
          git config user.email robot@users.noreply.github.com
          git add data
          git diff --cached --quiet || git commit -m "maj $(date -u +%FT%TZ)"
          git push
